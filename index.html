<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C5CFC">
<title>Yahtzee! — Scorekeeper</title>
<!-- Fonts via CDN for now; vendored locally in phase 7 (falls back to system-ui offline). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="device" id="device">
  <div class="screen-tint" aria-hidden="true"></div>
  <div class="stage">
    <header>
      <div class="brand">
        <div class="word">
          <span class="dice"><span class="d"><b></b></span><span class="d"><b></b></span></span>
          <span class="logo"><span>Y</span><span>A</span><span>H</span><span>T</span><span>Z</span><span>E</span><span>E</span><span>!</span></span>
        </div>
        <div class="hbtns">
          <button class="hbtn icon" id="soundBtn" title="Sound">🔊</button>
          <button class="hbtn icon" id="pepBtn" title="Amber pep talks: on">💬</button>
          <button class="hbtn icon" id="setBtn" title="Settings">⚙️</button>
          <button class="hbtn" id="statsBtn">Stats</button>
          <button class="hbtn" id="dataBtn">Data</button>
          <button class="hbtn" id="newBtn">New</button>
        </div>
      </div>
    </header>

    <div class="hud">
      <div class="ppanel" data-p="0">
        <div class="pcap"><span class="pflag"></span><input class="pname" data-p="0" value="Dan" maxlength="12"></div>
        <div class="ptotal" id="tot0">0</div>
        <div class="pmini" id="pmini0">0 up · 63 to +35</div>
        <div class="pmeta" id="meta0">0 / 13 boxes</div>
      </div>

      <div class="center">
        <div class="round" id="roundLabel">Round 1 of 13</div>
        <div class="leader" id="leaderLabel">Tied</div>
        <div class="gapbar"><div class="gapfill" id="gapFill"></div></div>
        <div class="savage" id="savageLabel" data-lvl="1">L1</div>
      </div>

      <div class="ppanel" data-p="1">
        <div class="pcap"><span class="pflag"></span><input class="pname" data-p="1" value="Amber" maxlength="12"></div>
        <div class="ptotal" id="tot1">0</div>
        <div class="pmini" id="pmini1">0 up · 63 to +35</div>
        <div class="pmeta" id="meta1">0 / 13 boxes</div>
      </div>
    </div>

    <div class="statusline-wrap">
      <div class="statusline turn p0" id="statusLine">🎲 <b>Dan</b>'s turn — roll, then tap a box to score.</div>
      <div class="caption" id="caption" aria-live="polite"></div>
    </div>

    <div class="board">
      <div class="block">
        <div class="blockhead">Upper section</div>
        <div class="grid" id="upperGrid"></div>
        <div class="grid" id="upperCalc"></div>
      </div>
      <div class="block">
        <div class="blockhead">Lower section</div>
        <div class="grid" id="lowerGrid"></div>
        <div class="grid" id="lowerCalc"></div>
      </div>
    </div>
  </div>

  <div class="rotate-notice" id="rotateNotice">
    <div class="rn-glyph">↺</div>
    <div class="rn-title">Turn landscape</div>
    <div class="rn-sub">This board wants a wide screen — rotate your device or widen the window. A phone layout is coming.</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"><div class="entry" id="entry"></div></div>
<div class="scrim setup" id="setupScrim"><div class="setupcard" id="setupCard"></div></div>
<div id="mascot-stage" class="mascot-stage" aria-hidden="true"></div>
<div class="statsscreen" id="statsScreen">
  <div class="statshead">
    <div class="statstitle">📊 Stats</div>
    <button class="hbtn" id="statsBack">← Back to game</button>
  </div>
  <div class="statsbody" id="statsBody"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
